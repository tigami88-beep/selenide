name: Java CI with Gradle

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: "11"
          distribution: "temurin"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build JAR (without tests)
        run: ./gradlew clean build -x test --no-daemon

      - name: Prepare artifacts folder
        run: mkdir -p artifacts

      - name: Copy JAR to artifacts
        run: cp build/libs/*.jar artifacts/app-mbank.jar

      - name: Start SUT (in background)
        run: java -jar ./artifacts/app-mbank.jar > sut.log 2>&1 &

      - name: Wait for SUT to be ready
        run: |
          max_attempts=60
          for i in $(seq 1 $max_attempts); do
            if curl -f -s http://localhost:8080/ > /dev/null 2>&1; then
              echo "SUT is ready"
              break
            fi
            echo "Waiting for SUT (attempt $i/$max_attempts)..."
            sleep 2
          done
          if [ $i -eq $max_attempts ]; then
            echo "SUT did not become ready in time"
            cat sut.log
            exit 1
          fi

      - name: Run tests with Selenide headless
        run: ./gradlew test --info -Dselenide.headless=true --stacktrace

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: build/reports/tests/